# nginx-конфиг для fridaycompanybot.ru.
# Путь установки: /etc/nginx/sites-available/fridaycompanybot.ru
# Активация:     ln -s /etc/nginx/sites-available/fridaycompanybot.ru
#                       /etc/nginx/sites-enabled/
#
# После получения сертификата через `certbot --nginx -d fridaycompanybot.ru`
# certbot сам добавит ssl_certificate / ssl_certificate_key и редирект
# HTTP→HTTPS. Изначально файл — HTTP-only (нужен certbot'у для ACME-вызова).

server {
    listen 80;
    listen [::]:80;
    server_name fridaycompanybot.ru;

    # Бот возвращает text/html для /report/{token} (премиум-отчёты),
    # text/plain для остальных. ЮKassa webhook ~10 КБ.
    client_max_body_size 64k;

    access_log /var/log/nginx/fridaycompanybot.ru.access.log;
    error_log /var/log/nginx/fridaycompanybot.ru.error.log;

    # Проксируем всё в локальный aiohttp-сервер бота (порт 8080).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # КРИТИЧНО для IP-whitelist ЮKassa в webhook'е:
        # бот читает X-Forwarded-For чтобы определить реальный IP клиента.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # ЮKassa ретраит если ответ дольше 10 сек — даём небольшой запас.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
